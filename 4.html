<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт в разработке</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #1a1a2e; color: white; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center; }
        .card { padding: 40px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); max-width: 500px; margin: 20px; }
        .badge { background: #ffbc00; color: #1a1a2e; padding: 5px 15px; font-weight: bold; border-radius: 20px; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 20px; }
        h1 { font-size: 2.5em; margin: 0 0 15px 0; font-weight: 300; }
        p { color: #a0a0ab; font-size: 1.1em; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">В процессе</div>
        <h1>Здесь скоро что-то будет</h1>
        <p>Я вовсю пишу HTML и CSS код для этого проекта. Поднимаем пару серверов, наводим красоту. Загляните чуть позже!</p>
    </div>

</body>
</html>
