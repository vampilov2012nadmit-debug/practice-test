<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Первая Веб-Игра</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #eef2f3; height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; text-align: center; }
        .game-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 2px solid #333; }
        h1 { font-size: 2em; margin-bottom: 10px; color: #222; }
        .score { font-size: 3.5em; font-weight: bold; color: #e91e63; margin: 20px 0; }
        .click-btn { padding: 15px 40px; font-size: 1.2em; font-weight: bold; background: #00bcd4; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #008ba3; transition: 0.1s; }
        .click-btn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

    <div class="game-box">
        <h1>Прокачай счетчик!</h1>
        <p>Нажимай на кнопку, чтобы зарабатывать очки</p>
        <div class="score" id="counter">0</div>
        <button class="click-btn" onclick="increaseScore()">КЛИК!</button>
    </div>

    <script>
        let score = 0;
        function increaseScore() {
            score++;
            document.getElementById('counter').innerText = score;
        }
    </script>

</body>
</html>
